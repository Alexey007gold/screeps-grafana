version: "2"
volumes:
  screeps-grafana_graphite_conf:
    external: true
  screeps-grafana_graphite_data:
    external: true
  screeps-grafana_grafana_data:
    external: true
services:
  node:
    build:
        context: .
        dockerfile: Dockerfile
    restart: always
    links:
     - graphite
    environment:
     GRAPHITE_PORT_8125_UDP_ADDR: "graphite"
    env_file: docker-compose.env
  graphite:
    image: graphiteapp/graphite-statsd
    restart: always
    volumes:
     - screeps-grafana_graphite_conf:/opt/graphite/conf
     - screeps-grafana_graphite_data:/opt/graphite/storage/whisper
  grafana:
    image: grafana/grafana
    restart: always
    volumes:
     - screeps-grafana_grafana_data:/var/lib/grafana
    links:
     - graphite
    ports:
     - "1337:3000"
